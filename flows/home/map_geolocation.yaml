# Regression test placeholder — черновик идеи, статус остаётся "В планах"
# ID: 14
# Scenario: Геолокация на карте
#
# ИДЕЯ РЕАЛИЗАЦИИ: Maestro умеет подменять GPS-координаты устройства (setLocation, Android
# API 31+) и симулировать движение (travel). Набросок сценария:
# 1. Задать координаты рядом с известной тестовой станцией ("Гипермаркет Green").
# 2. Открыть карту, убедиться что метка "моё местоположение" появилась рядом с этой точкой
#    (или что список станций отсортирован по близости, если такая сортировка есть).
# 3. Через travel сместить координаты на несколько сотен метров и проверить, что метка/
#    список отреагировали на изменение.
#
# ОТКРЫТЫЕ ВОПРОСЫ (нужно проверить руками, не через код):
# - есть ли у пина "моё местоположение" на карте вообще стабильный локатор для assert,
#   или там просто картинка без testid/текста;
# - нужно ли permissions.location: allow в launchApp, чтобы приложение приняло setLocation;
# - работает ли setLocation в используемом эмуляторе (зависит от API level).

- launchApp:
    permissions:
      location: allow

- setLocation:
    latitude: 53.9006 # TODO: подставить реальные координаты тестовой станции
    longitude: 27.5590

- runFlow:
    file: ../../subflows/auth/login.yaml

