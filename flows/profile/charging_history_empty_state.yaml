appId: by.batteryfly.ev_charging.dev
---
# "История заправок" — пустой грид

- runFlow:
    file: ../../subflows/auth/login.yaml
    env:
      EMAIL: "${EMPTY_HISTORY_TEST_EMAIL}"
      PASSWORD: "${PASSWORD}"

- tapOn: "lera\nWelcome"
- tapOn: "Charging history"

- assertVisible: ".*[Nn]o.*charging.*history.*yet.*"
