appId: by.batteryfly.ev_charging.dev
---
# ЧЕРНОВИК: фильтр "Свободно" — карта + список
# Локаторы ниже — заглушки (TODO), нужно свериться с реальным экраном (иконка/кнопка фильтра,
# текст чипа "Свободно", признак недоступности станции в карточке).

- runFlow:
    file: ../../subflows/auth/login.yaml

- tapOn: ".*[Ff]ilter.*" # TODO: реальный локатор кнопки/иконки фильтров
- tapOn: ".*[Aa]vailable.*" # TODO: реальный текст/id чипа "Свободно"

- tapOn:
    text: ".*List.*"
- waitForAnimationToEnd:
    timeout: 5000

# После фильтра в списке не должно остаться недоступных станций
- assertNotVisible: ".*[Uu]navailable.*" # TODO: реальный текст/бейдж недоступности
