
appId: by.batteryfly.ev_charging.dev
---

- stopApp: "com.android.chrome"

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    point: 93%, 9%
- extendedWaitUntil:
    visible: "Welcome back!"
    timeout: 15000


- tapOn:
    id: "username"
- back
- tapOn:
    id: "username"
- inputText: "${EMAIL}"


- hideKeyboard
- tapOn:
    id: "password"
- inputText: "${PASSWORD}"

- hideKeyboard

- tapOn:
    text: "Login"
    index: 1

# После входа иногда всплывает попап(ы) с кнопкой "Close" — закрываем, пока не пропадёт
- repeat:
    while:
      visible: "Close"
    commands:
      - tapOn: "Close"

- extendedWaitUntil:
    visible: "lera\nWelcome"
    timeout: 30000
    optional: true

