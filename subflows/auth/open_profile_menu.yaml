# Открыть профиль ("lera\nWelcome")
appId: by.batteryfly.ev_charging.dev
---
- extendedWaitUntil:
    visible: "lera\nWelcome"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible: "lera\nWelcome"
    commands:
      - pressKey: "Home"
      - launchApp:
          appId: by.batteryfly.ev_charging.dev
      - extendedWaitUntil:
          visible: "lera\nWelcome"
          timeout: 30000

- tapOn: "lera\nWelcome"
